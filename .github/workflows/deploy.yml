name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Cada día se vuelven a descargar las estratagemas de Wahapedia
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas del motor con los datos actuales de BSData
        run: |
          git clone --depth 1 https://github.com/BSData/wh40k-11e.git /tmp/wh40k-11e
          BSDATA_DIR=/tmp/wh40k-11e npm test
      - name: Estratagemas y reglas de destacamento de Wahapedia
        run: |
          mkdir -p public/wahapedia
          for f in Factions Stratagems Detachment_abilities Last_update; do
            curl -fsSL --retry 3 --retry-delay 5 -A "Mozilla/5.0 (war-army personal app)" \
              -o "public/wahapedia/$f.csv" "https://wahapedia.ru/wh40k11ed/$f.csv" \
              || { echo "::warning::No se pudo descargar $f.csv de Wahapedia"; rm -f "public/wahapedia/$f.csv"; }
          done
          for page in core-rules warhammer-event-companion rules-appendix; do
            curl -fsSL --retry 3 --retry-delay 5 -A "Mozilla/5.0 (war-army personal app)" \
              -o "public/wahapedia/$page.html" "https://wahapedia.ru/wh40k11ed/the-rules/$page/" \
              || { echo "::warning::No se pudo descargar $page de Wahapedia"; rm -f "public/wahapedia/$page.html"; }
          done
          ls -la public/wahapedia
          wc -l public/wahapedia/*.csv || true
          head -c 300 public/wahapedia/Stratagems.csv || true
      - name: Terrain layouts from the official Warhammer Event Companion (free PDF)
        run: |
          # 15 Force Disposition pairings x layouts A/B/C on pages 9-53, rendered to images
          mkdir -p public/layouts /tmp/ec
          if ! command -v pdftoppm > /dev/null; then
            (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils) > /dev/null 2>&1 || echo "::warning::poppler-utils not installed"
          fi
          if command -v pdftoppm > /dev/null && curl -fsSL --retry 3 --retry-delay 5 -o /tmp/ec/ec.pdf \
            "https://assets.warhammer-community.com/eng_12-06_warhammer40000_event_companion-s3bfb5f9s1-ivswuij3fo.pdf"; then
            pdftoppm -f 9 -l 53 -jpeg -jpegopt quality=78 -scale-to 1400 /tmp/ec/ec.pdf /tmp/ec/p
            i=0
            for f in $(ls /tmp/ec/p-*.jpg | sort -V); do
              cp "$f" "public/layouts/$i.jpg"; i=$((i+1))
            done
            echo "Layouts: $i images"; du -sh public/layouts
          else
            echo "::warning::Could not download the Event Companion PDF (terrain layouts)"
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
